<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="32" height="32">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- Persona Caminando SENA (Símbolo de Formación y Futuro) -->
  <g filter="url(#shadow)">
    <!-- Cabeza (Cabeza en avance) -->
    <circle cx="32" cy="12" r="7" fill="#39A900" stroke="#ffffff" stroke-width="1.5" />
    
    <!-- Torso con inclinación de marcha -->
    <path d="M 30 20 L 34 33 L 30 40" fill="none" stroke="#39A900" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Brazos en movimiento de caminata -->
    <!-- Brazo delantero (hacia arriba y adelante) -->
    <path d="M 31 24 L 43 21 L 49 28" fill="none" stroke="#39A900" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Brazo trasero (hacia atrás) -->
    <path d="M 31 24 L 20 28 L 14 36" fill="none" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Piernas en zancada dinámica hacia adelante -->
    <!-- Pierna delantera (avanzando) -->
    <path d="M 30 40 L 40 46 L 47 58" fill="none" stroke="#39A900" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Pierna trasera (apoyo / impulso) -->
    <path d="M 30 40 L 22 47 L 16 58" fill="none" stroke="#1e293b" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Pie / zancada -->
    <path d="M 47 58 L 52 58" stroke="#39A900" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 16 58 L 11 57" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round" />
  </g>
</svg>
